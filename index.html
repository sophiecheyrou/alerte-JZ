<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101827" />
  <title>Suivi sécurité – Internat Jean Zay</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=9" />
</head>
<body>
  <header class="topbar">
    <button id="homeBtn" class="brand" aria-label="Retour à l’accueil">
      <strong>Internat Jean Zay</strong>
      <span>Suivi de l’exercice de sécurité</span>
    </button>
    <div class="top-actions">
      <span id="syncState" class="sync-state"></span>
      <button id="archiveBtn" class="archive-button">Archives</button>
      <button id="newExerciseBtn" class="reset-button">Nouvel exercice</button>
      <button id="installBtn" class="install-button" hidden>Installer</button>
    </div>
  </header>

  <main>
    <section id="home" class="view active">
      <div class="hero compact-hero">
        <p class="eyebrow">EXERCICE DE SÉCURITÉ</p>
        <h1>Choisir un poste</h1>
      </div>

      <div class="home-grid">
        <button class="role-card pair-card" data-role="PAIR">
          <span class="role-icon">P</span>
          <span class="role-copy"><b>COUR MONTMORENCY</b><small>Chambres paires</small></span>
        </button>
        <button class="role-card impair-card" data-role="IMPAIR">
          <span class="role-icon">I</span>
          <span class="role-copy"><b>COUR D’HONNEUR</b><small>Chambres impaires</small></span>
        </button>
        <button class="role-card loge-card" data-role="LOGE">
          <span class="role-icon">L</span>
          <span class="role-copy"><b>LOGE</b><small>Élèves sortis</small></span>
        </button>
        <button class="role-card dashboard-card" data-role="DIRECTION">
          <span class="role-icon">D</span>
          <span class="role-copy"><b>TABLEAU DE BORD</b><small>Suivi en direct</small></span>
        </button>
      </div>

      <div id="homeSummary" class="home-summary"></div>
    </section>

    <section id="app" class="view">
      <div class="screen-header compact-header">
        <button id="backBtn" class="back-button">← Accueil</button>
        <div class="screen-title">
          <p id="roleSubtitle" class="eyebrow"></p>
          <h1 id="roleTitle"></h1>
        </div>
      </div>

      <div id="kpis" class="kpis"></div>

      <div id="searchWrap" class="search-wrap">
        <label for="roomSearch" class="sr-only">Rechercher une chambre</label>
        <input id="roomSearch" type="search" inputmode="text" autocomplete="off" placeholder="Rechercher une chambre…" />
        <button id="clearSearchBtn" class="clear-search" aria-label="Effacer la recherche" hidden>×</button>
      </div>
      <div id="searchResult" class="search-result" hidden></div>

      <div id="operationalGroups" class="floor-groups"></div>

      <div id="missingGroups" class="missing-groups" hidden></div>
      <div id="dashboardActions" class="dashboard-actions" hidden>
        <button id="saveExerciseBtn" class="primary-action">Sauvegarder l’exercice</button>
        <button id="emailReportBtn" class="secondary-action">Envoyer le compte-rendu par mail</button>
      </div>
    </section>

    <section id="archives" class="view">
      <div class="screen-header compact-header">
        <button id="archivesBackBtn" class="back-button">← Accueil</button>
        <div class="screen-title">
          <p class="eyebrow">HISTORIQUE</p>
          <h1>Archives des exercices</h1>
        </div>
      </div>
      <div id="archivesTools" class="archives-tools" hidden>
        <label class="select-all-archives"><input id="selectAllArchives" type="checkbox"> <span>Tout sélectionner</span></label>
        <button id="deleteSelectedArchivesBtn" class="delete-selected-archives" disabled>Supprimer la sélection</button>
      </div>
      <div id="archivesList" class="archives-list"></div>
    </section>
  </main>

  <div id="confirmDialog" class="dialog-backdrop" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <div class="dialog-icon">!</div>
      <h2 id="dialogTitle">Démarrer un nouvel exercice ?</h2>
      <p>L’exercice en cours peut être sauvegardé avant remise à zéro. Toutes les chambres repasseront ensuite en rouge « Non localisé ».</p>
      <div class="dialog-actions three-actions">
        <button id="cancelResetBtn" class="secondary-button">Annuler</button>
        <button id="saveThenResetBtn" class="primary-button">Sauvegarder puis recommencer</button>
        <button id="confirmResetBtn" class="danger-button">Remettre à zéro</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="rooms-data.js?v=9"></script>
  <script src="config.js?v=9"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
